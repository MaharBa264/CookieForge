name: CookieForge baseline quality

on:
  push:
    branches: [main, 'feature/**']
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type and Svelte checks
        run: pnpm run check
      - name: Unit and geometry tests
        run: pnpm run test:run -- --maxWorkers=1
      - name: Production build
        run: pnpm run build
      - name: STL and 3MF smoke tests
        run: pnpm run test:smoke
