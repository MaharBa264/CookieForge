server {
  listen 80;
  server_name _;

  # Las redirecciones deben ser relativas: nginx escucha en el 80 interno del contenedor,
  # pero la aplicación se publica en otro puerto del equipo (8787). Con redirecciones
  # absolutas el navegador terminaría en el puerto 80 del equipo (otro servicio).
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La aplicación se publica en /cookie-cutter-designer/
  location = / {
    return 302 /cookie-cutter-designer/;
  }

  location /cookie-cutter-designer/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /cookie-cutter-designer/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /cookie-cutter-designer/index.html;
  }
}
