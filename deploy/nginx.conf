server {
    listen 80;
    server_name _;
    # Preserve the browser's external host/port (e.g. :8787 behind Docker NAT).
    # Otherwise a root redirect may incorrectly send users to port 80 (Mainsail).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Keep Vite's existing production base path; do not change the app.
    location = / {
        return 302 /cookie-cutter-designer/;
    }
    location = /cookie-cutter-designer {
        return 301 /cookie-cutter-designer/;
    }
    location /cookie-cutter-designer/ {
        try_files $uri $uri/ /cookie-cutter-designer/index.html;
    }
    location ~* ^/cookie-cutter-designer/assets/.*\.(js|css|woff2?|png|jpe?g|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
